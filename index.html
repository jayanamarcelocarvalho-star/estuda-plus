
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6658d3"><meta name="description" content="Estuda Plus — sua plataforma de estudos interativos.">
  <title>Estuda Plus — aprenda no seu ritmo</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#inicio" aria-label="Estuda Plus início"><span class="brand-mark">E+</span><span>Estuda <b>Plus</b><small>seu espaço de aprender</small></span></a>
      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-link active" data-view="inicio"><span>⌂</span> Início</button>
        <button class="nav-link" data-view="materias"><span>▦</span> Matérias</button>
        <button class="nav-link" data-view="atividades"><span>✎</span> Atividades</button>
        <button class="nav-link" data-view="simulados"><span>◷</span> Simulados</button>
        <button class="nav-link" data-view="resumos"><span>▤</span> Resumos</button>
        <button class="nav-link" data-view="favoritos"><span>♡</span> Favoritos</button>
        <button class="nav-link" data-view="progresso"><span>↗</span> Meu progresso</button>
        <button class="nav-link" data-view="historico"><span>◴</span> Histórico</button>
      </nav>
      <div class="sidebar-bottom"><div class="mini-goal"><span class="goal-icon">✦</span><b>Um passo por vez!</b><p>Seu esforço de hoje constrói seu amanhã.</p></div><button class="nav-link" data-view="configuracoes"><span>⚙</span> Configurações</button></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button id="menuToggle" class="icon-btn mobile-only" aria-label="Abrir menu">☰</button><div class="breadcrumb" id="breadcrumb">Seu espaço de estudos</div><div class="top-actions"><button class="icon-btn" id="themeToggle" aria-label="Alternar tema" title="Alternar tema">☾</button><div class="avatar" aria-hidden="true">E</div></div></header>
      <div id="app" class="content" tabindex="-1"><div class="loading">Preparando seu espaço de estudos…</div></div>
      <footer class="footer">Estuda Plus <span>•</span> Aprender é uma construção diária.</footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirmDialog" class="dialog"><form method="dialog"><h2 id="dialogTitle">Confirmar ação</h2><p id="dialogText">Tem certeza?</p><div class="dialog-actions"><button class="btn btn-soft" value="cancel">Cancelar</button><button class="btn btn-danger" id="dialogConfirm" value="confirm">Confirmar</button></div></form></dialog>
  <script src="script.js"></script>
</body></html>
